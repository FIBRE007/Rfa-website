name: Strengthen hero overlays

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hero-overlay-update.yml'

permissions:
  contents: write

jobs:
  strengthen-hero-overlays:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update shared hero overlays and cache-bust CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          components = Path('shared/css/components.css')
          text = components.read_text(encoding='utf-8')
          text = text.replace(
              '.hero__scrim { position: absolute; inset: 0; background: var(--gradient-scrim); z-index: -1; }',
              '.hero__scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,12,18,0.52) 0%, rgba(14,12,18,0.44) 42%, rgba(14,12,18,0.80) 100%); z-index: -1; }'
          )
          text = text.replace(
              '.subhero__scrim { position: absolute; inset: 0; background: var(--gradient-scrim); z-index: -1; }',
              '.subhero__scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,12,18,0.50) 0%, rgba(14,12,18,0.42) 45%, rgba(14,12,18,0.78) 100%); z-index: -1; }'
          )
          components.write_text(text, encoding='utf-8')

          gateway = Path('shared/css/gateway.css')
          g = gateway.read_text(encoding='utf-8')
          g = g.replace(
              '.gateway__scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,12,18,0.38) 0%, rgba(14,12,18,0.26) 40%, rgba(14,12,18,0.55) 100%); z-index: -1; }',
              '.gateway__scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,12,18,0.56) 0%, rgba(14,12,18,0.46) 40%, rgba(14,12,18,0.72) 100%); z-index: -1; }'
          )
          gateway.write_text(g, encoding='utf-8')

          old_components = 'https://assets.royalfamilyacademy.org/shared/css/components.css'
          new_components = old_components + '?v=hero-overlay-20260901'
          old_gateway = 'https://assets.royalfamilyacademy.org/shared/css/gateway.css'
          new_gateway = old_gateway + '?v=hero-overlay-20260901'

          changed = []
          for path in Path('.').rglob('*.html'):
              h = path.read_text(encoding='utf-8')
              updated = h.replace(old_components + '?v=hero-overlay-20260901', new_components).replace(old_components, new_components)
              updated = updated.replace(old_gateway + '?v=hero-overlay-20260901', new_gateway).replace(old_gateway, new_gateway)
              if updated != h:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} HTML files for CSS cache busting.')
          PY

      - name: Commit overlay update
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+FIBRE007@users.noreply.github.com'
          git add shared/css/components.css shared/css/gateway.css -- '*.html'
          git commit -m 'Strengthen hero overlays across site'
          git push origin HEAD:main
