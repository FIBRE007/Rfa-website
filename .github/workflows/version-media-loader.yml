name: Version shared media loader references

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/version-media-loader.yml'

permissions:
  contents: write

jobs:
  update-media-loader-references:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version media loader on every HTML page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'https://assets.royalfamilyacademy.org/shared/js/media.js'
          new = 'https://assets.royalfamilyacademy.org/shared/js/media.js?v=5c15b4b'

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old + '?v=5c15b4b', new).replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} HTML files:')
          for path in changed:
              print(path)
          PY

      - name: Commit repository-wide cache bust
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No HTML changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'Version media loader across all pages'
          git push origin HEAD:main
