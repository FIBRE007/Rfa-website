name: Install High School header layout

on:
  push:
    branches: [main]
    paths:
      - 'shared/css/highschool-header.css'
      - 'scripts/install-highschool-header-layout.mjs'
      - '.github/workflows/install-highschool-header-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-header:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install High School header stylesheet
        run: node scripts/install-highschool-header-layout.mjs

      - name: Remove one-time installer
        run: |
          rm -f scripts/install-highschool-header-layout.mjs
          rm -f .github/workflows/install-highschool-header-layout.yml

      - name: Commit High School header update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "High School header is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+FIBRE007@users.noreply.github.com"
          git add -A
          git commit -m "Move High School identity above navigation"
          git pull --rebase origin main
          git push origin main
