name: Staticize RFA recovered content

on:
  push:
    branches: [main]
    paths:
      - 'scripts/staticize-rfa-archive.mjs'
      - 'scripts/clean-public-copy.mjs'
      - '.github/workflows/staticize-rfa-content.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  staticize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write recovered content into static HTML
        run: node scripts/staticize-rfa-archive.mjs

      - name: Remove migration provenance from visitor-facing copy
        run: node scripts/clean-public-copy.mjs

      - name: Commit generated static pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No static content changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add highschool nurseryandprimaryschool sixthform shared/js/archive-content.js scripts/staticize-rfa-archive.mjs
          git commit -m "Clean visitor-facing RFA content provenance wording"
          git push
