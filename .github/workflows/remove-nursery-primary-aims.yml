name: Remove Nursery Primary Aims

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-nursery-primary-aims.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-aims:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Aims section
        run: node scripts/remove-nursery-primary-aims.mjs

      - name: Remove one-time helper files
        run: |
          rm scripts/remove-nursery-primary-aims.mjs
          rm .github/workflows/remove-nursery-primary-aims.yml

      - name: Commit About page update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+FIBRE007@users.noreply.github.com"
          git add nurseryandprimaryschool/about.html scripts/remove-nursery-primary-aims.mjs .github/workflows/remove-nursery-primary-aims.yml
          git commit -m "Remove aims section from Nursery Primary About page"
          git pull --rebase origin main
          git push origin main
