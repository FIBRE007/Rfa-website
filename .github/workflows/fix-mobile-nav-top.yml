name: Finish mobile nav fix
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-nav-top.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version shared navigation CSS
        run: >-
          python3 -c "from pathlib import Path; import re; files=list(Path('nurseryandprimaryschool').glob('*.html')); [p.write_text(re.sub(r'https://assets\.royalfamilyacademy\.org/shared/css/components\.css(?:\?v=[^\"\']*)?', 'https://assets.royalfamilyacademy.org/shared/css/components.css?v=mobile-nav-top-20260901', p.read_text())) for p in files]"
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nurseryandprimaryschool/*.html
          git diff --cached --quiet || git commit -m "Refresh mobile navigation CSS across nursery site"
          git push
