name: Scrub Public Provenance Copy
on:
  push:
    branches: [clean-public-provenance-copy]
    paths:
      - scripts/scrub-public-provenance.mjs
      - .github/workflows/scrub-public-provenance.yml
permissions:
  contents: write
jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean-public-provenance-copy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scrub visitor-facing provenance wording
        run: node scripts/scrub-public-provenance.mjs
      - name: Rebuild RFA Guide site index
        run: node scripts/build-rfa-search-index.mjs
      - name: Verify no obsolete provenance language remains in public HTML
        run: |
          ! grep -RniE 'former website|former admission guidance|former school FAQ|former FAQ|former RFA framework|former site|recovered content|archived content' highschool nurseryandprimaryschool sixthform
      - name: Commit cleaned public copy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add highschool nurseryandprimaryschool sixthform shared/js/archive-content.js shared/js/rfa-site-index.js scripts/staticize-rfa-archive.mjs scripts/clean-public-copy.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Remove obsolete website provenance from public copy"
          git push
