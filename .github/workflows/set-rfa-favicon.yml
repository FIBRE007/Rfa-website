name: Set RFA favicon

on:
  push:
    branches: [main]
    paths:
      - 'scripts/set-rfa-favicon.mjs'
      - '.github/workflows/set-rfa-favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  set-favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply RFA crest favicon to website pages
        run: node scripts/set-rfa-favicon.mjs

      - name: Remove one-time favicon installer
        run: rm -f scripts/set-rfa-favicon.mjs .github/workflows/set-rfa-favicon.yml

      - name: Commit favicon update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+FIBRE007@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No favicon changes to commit."
            exit 0
          fi
          git commit -m "Use RFA crest as website favicon"
          git pull --rebase origin main
          git push origin main
