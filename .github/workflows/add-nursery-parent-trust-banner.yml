name: Add Nursery Parent Trust Banner

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-nursery-parent-trust-banner.yml'

permissions:
  contents: write

jobs:
  add-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add parent trust banner to Nursery and Primary homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nurseryandprimaryschool/index.html')
          text = path.read_text(encoding='utf-8')

          css = '''
  .parent-trust-banner {
    position: relative;
    overflow: hidden;
    background: linear-gradient(115deg, #2f0f58 0%, #431677 56%, #5b268f 100%);
    color: #fff;
    padding: clamp(3rem, 7vw, 5.5rem) var(--gutter);
  }
  .parent-trust-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 88% 18%, rgba(198,162,78,0.22), transparent 32%),
      linear-gradient(90deg, rgba(14,12,18,0.20), transparent 55%);
    pointer-events: none;
  }
  .parent-trust-banner__inner {
    position: relative;
    z-index: 1;
    max-width: var(--container-max);
    margin: 0 auto;
    display: grid;
    gap: 2rem;
    align-items: center;
  }
  .parent-trust-banner__mark {
    width: clamp(120px, 18vw, 190px);
    background: rgba(255,255,255,0.96);
    border-radius: 18px;
    padding: 1rem 1.15rem;
    box-shadow: 0 20px 50px rgba(14,12,18,0.22);
  }
  .parent-trust-banner__mark img { width: 100%; height: auto; display: block; }
  .parent-trust-banner__eyebrow {
    color: var(--rfa-gold-400);
    font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wider);
    text-transform: uppercase;
    font-weight: 700;
  }
  .parent-trust-banner__title {
    margin-top: .45rem;
    max-width: 18ch;
    font-family: var(--font-display);
    font-size: clamp(2.1rem, 5vw, 4.25rem);
    line-height: 1.02;
    color: #fff;
  }
  .parent-trust-banner__copy {
    margin-top: 1rem;
    max-width: 62ch;
    color: rgba(255,252,247,0.88);
    font-size: clamp(1rem, 1.5vw, 1.2rem);
    line-height: 1.7;
  }
  .parent-trust-banner__link {
    display: inline-flex;
    margin-top: 1.4rem;
    align-items: center;
    gap: .55rem;
    color: var(--rfa-gold-300);
    font-weight: 700;
    letter-spacing: .03em;
  }
  .parent-trust-banner__link:hover,
  .parent-trust-banner__link:focus-visible { color: #fff; }
  @media (min-width: 760px) {
    .parent-trust-banner__inner { grid-template-columns: minmax(150px, .34fr) 1.66fr; gap: clamp(2rem, 5vw, 4rem); }
  }
'''

          if '.parent-trust-banner {' not in text:
              text = text.replace('</style>', css + '</style>', 1)

          banner = '''
<section class="parent-trust-banner" aria-labelledby="parent-trust-title">
  <div class="parent-trust-banner__inner">
    <div class="parent-trust-banner__mark" data-reveal="up">
      <img src="https://media.royalfamilyacademy.org/acsi/acsi-logo.png" alt="Association of Christian Schools International accreditation mark">
    </div>
    <div data-reveal="up">
      <p class="parent-trust-banner__eyebrow">A Foundation Parents Can Trust</p>
      <h2 class="parent-trust-banner__title" id="parent-trust-title">Christian education with recognised accreditation.</h2>
      <p class="parent-trust-banner__copy">Royal Family Academy is an ACSI Accredited School. For parents, that means the Christian foundation surrounding your child is not simply part of our language; it is part of a school community that has undergone a recognised accreditation process. From the earliest years, we are intentional about building faith, character and a strong academic foundation together.</p>
      <a class="parent-trust-banner__link" href="https://royalfamilyacademy.org/">Learn more about Royal Family Academy <span aria-hidden="true">→</span></a>
    </div>
  </div>
</section>
'''

          admissions = '<section class="cta-banner" id="admissions">'
          if 'id="parent-trust-title"' not in text:
              text = text.replace(admissions, banner + admissions, 1)

          # Correct the duplicated query string introduced by an earlier
          # cache-busting pass while this page is being edited.
          text = text.replace('media.js?v=5c15b4b?v=5c15b4b', 'media.js?v=5c15b4b')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit banner
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+FIBRE007@users.noreply.github.com'
          git add nurseryandprimaryschool/index.html
          git commit -m 'Add parent trust banner to nursery homepage'
          git push origin HEAD:main
