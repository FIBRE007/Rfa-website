name: Fix High School Admissions Header
on:
  push:
    branches: [fix-highschool-admissions-header]
    paths:
      - scripts/fix-highschool-admissions-header.py
      - .github/workflows/fix-highschool-admissions-header.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-highschool-admissions-header
      - name: Apply guarded patch
        run: python scripts/fix-highschool-admissions-header.py
      - name: Verify expected header hooks
        run: |
          grep -q 'class="container site-nav"' highschool/admissions.html
          grep -q 'id="mobile-nav"' highschool/admissions.html
          grep -q 'components.css?v=mobile-nav-top-20260901' highschool/admissions.html
      - name: Commit patched page
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add highschool/admissions.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix High School admissions header markup"
          git push
