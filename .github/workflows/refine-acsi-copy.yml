name: Refine ACSI copy
on:
  push:
    paths:
      - .github/workflows/refine-acsi-copy.yml
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine banner
        run: |
          sed -i '/parent-trust-banner__copy/d' nurseryandprimaryschool/index.html
          sed -i 's/font-size: \.72rem;/font-size: clamp(.9rem, 1.25vw, 1.12rem);/' nurseryandprimaryschool/index.html
          sed -i '0,/letter-spacing: \.18em;/s//letter-spacing: .14em;/' nurseryandprimaryschool/index.html
          sed -i '0,/font-weight: 700;/s//font-weight: 800;/' nurseryandprimaryschool/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nurseryandprimaryschool/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine ACSI banner hierarchy"
          git push
