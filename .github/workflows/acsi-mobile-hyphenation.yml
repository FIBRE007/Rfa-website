name: ACSI mobile hyphenation

on:
  push:
    paths:
      - '.github/workflows/acsi-mobile-hyphenation.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable dynamic hyphenation with typed reveal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('nurseryandprimaryschool/index.html')
          s = p.read_text()

          old_css = """  .letter-reveal .letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(.12em) rotate(-1deg);
    filter: blur(1.5px);
    transition: opacity .18s ease, transform .22s ease, filter .22s ease;
    transition-delay: calc(var(--i) * 38ms);
  }
  .letter-reveal .letter.space { width: .3em; }
  .letter-reveal.is-writing .letter {
    opacity: 1;
    transform: translateY(0) rotate(0deg);
    filter: blur(0);
  }
"""
          new_css = """  .letter-reveal {
    hyphens: auto;
    -webkit-hyphens: auto;
    hyphenate-character: '-';
    overflow-wrap: normal;
    word-break: normal;
  }
  .letter-reveal.is-typing::after {
    content: '';
    display: inline-block;
    width: .06em;
    height: .85em;
    margin-left: .06em;
    background: currentColor;
    opacity: .7;
    vertical-align: -.05em;
    animation: acsi-caret .7s steps(1) infinite;
  }
  @keyframes acsi-caret { 50% { opacity: 0; } }
"""
          if old_css not in s:
              raise SystemExit('letter reveal CSS block not found')
          s = s.replace(old_css, new_css, 1)

          s = s.replace("""    .parent-trust-banner__eyebrow { font-size: .9rem; letter-spacing: .06em; }
    .parent-trust-banner__title { font-size: clamp(1.35rem, 6.8vw, 1.9rem); }
""", """    .parent-trust-banner__eyebrow { font-size: .9rem; letter-spacing: .06em; hyphens: auto; -webkit-hyphens: auto; }
    .parent-trust-banner__title { font-size: clamp(1.35rem, 6.8vw, 1.9rem); hyphens: auto; -webkit-hyphens: auto; }
""", 1)

          s = s.replace("""  @media (prefers-reduced-motion: reduce) {
    .letter-reveal .letter { opacity: 1; transform: none; filter: none; transition: none; }
  }
""", """  @media (prefers-reduced-motion: reduce) {
    .letter-reveal.is-typing::after { display: none; }
  }
""", 1)

          old_js = """<script>
(function () {
  const targets = document.querySelectorAll('[data-letter-reveal]');
  targets.forEach((el) => {
    const text = el.textContent;
    el.setAttribute('aria-label', text);
    el.textContent = '';
    Array.from(text).forEach((char, i) => {
      const span = document.createElement('span');
      span.className = 'letter' + (char === ' ' ? ' space' : '');
      span.style.setProperty('--i', i);
      span.setAttribute('aria-hidden', 'true');
      span.textContent = char === ' ' ? '\\u00A0' : char;
      el.appendChild(span);
    });
  });

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    targets.forEach((el) => el.classList.add('is-writing'));
    return;
  }

  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      const group = entry.target.closest('.parent-trust-banner');
      const groupTargets = group ? group.querySelectorAll('[data-letter-reveal]') : [entry.target];
      groupTargets.forEach((el, index) => {
        window.setTimeout(() => el.classList.add('is-writing'), index * 220);
      });
      groupTargets.forEach((el) => obs.unobserve(el));
    });
  }, { threshold: 0.35 });

  targets.forEach((el) => observer.observe(el));
})();
</script>"""
          new_js = """<script>
(function () {
  const targets = Array.from(document.querySelectorAll('[data-letter-reveal]'));
  const source = new Map();

  targets.forEach((el) => {
    const text = el.textContent;
    source.set(el, text);
    el.setAttribute('aria-label', text);
  });

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const typeText = (el, delay = 0) => {
    const text = source.get(el) || '';
    window.setTimeout(() => {
      let i = 0;
      el.textContent = '';
      el.classList.add('is-typing');
      const timer = window.setInterval(() => {
        i += 1;
        el.textContent = text.slice(0, i);
        if (i >= text.length) {
          window.clearInterval(timer);
          el.classList.remove('is-typing');
        }
      }, 38);
    }, delay);
  };

  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      const group = entry.target.closest('.parent-trust-banner');
      const groupTargets = group ? Array.from(group.querySelectorAll('[data-letter-reveal]')) : [entry.target];
      groupTargets.forEach((el, index) => typeText(el, index * 220));
      groupTargets.forEach((el) => obs.unobserve(el));
    });
  }, { threshold: 0.35 });

  targets.forEach((el) => observer.observe(el));
})();
</script>"""
          if old_js not in s:
              raise SystemExit('letter reveal script not found')
          s = s.replace(old_js, new_js, 1)
          p.write_text(s)
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nurseryandprimaryschool/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add dynamic mobile hyphenation to ACSI text"
          git push
