name: Refine ACSI banner style v2

on:
  push:
    paths:
      - '.github/workflows/refine-acsi-banner-style-v2.yml'

permissions:
  contents: write

jobs:
  refine-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine banner styles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('nurseryandprimaryschool/index.html')
          s = p.read_text()
          s = s.replace('background: rgba(255,255,255,0.98);\n    border-radius: 14px;\n    padding: .65rem .8rem;\n    box-shadow: 0 14px 36px rgba(14,12,18,0.20);', 'background: transparent;\n    padding: 0;\n    box-shadow: none;', 1)
          s = s.replace('.parent-trust-banner__mark img { width: 100%; height: auto; display: block; }', '.parent-trust-banner__mark img { width: 100%; height: auto; display: block; background: transparent; }', 1)
          s = s.replace('color: var(--rfa-gold-300);', 'color: #6fc2ff;', 1)
          s = s.replace('letter-spacing: -.015em;\n    color: #fff;', 'letter-spacing: .015em;\n    text-transform: uppercase;\n    color: #fff;', 1)
          s = s.replace('line-height: 1.55;\n  }', 'line-height: 1.55;\n    text-align: justify;\n    text-justify: inter-word;\n  }', 1)
          p.write_text(s)
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nurseryandprimaryschool/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine ACSI accreditation banner styling"
          git push
