name: Compact ACSI banner

on:
  push:
    paths:
      - '.github/workflows/compact-acsi-banner.yml'

permissions:
  contents: write

jobs:
  update-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update nursery homepage ACSI banner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nurseryandprimaryschool/index.html')
          s = p.read_text()

          old_css = '''  .parent-trust-banner {
    position: relative;
    overflow: hidden;
    background: linear-gradient(115deg, #2f0f58 0%, #431677 56%, #5b268f 100%);
    color: #fff;
    padding: clamp(3rem, 7vw, 5.5rem) var(--gutter);
  }
  .parent-trust-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 88% 18%, rgba(198,162,78,0.22), transparent 32%), linear-gradient(90deg, rgba(14,12,18,0.20), transparent 55%);
    pointer-events: none;
  }
  .parent-trust-banner__inner {
    position: relative;
    z-index: 1;
    max-width: var(--container-max);
    margin: 0 auto;
    display: grid;
    gap: 2rem;
    align-items: center;
  }
  .parent-trust-banner__mark {
    width: clamp(120px, 18vw, 190px);
    background: rgba(255,255,255,0.96);
    border-radius: 18px;
    padding: 1rem 1.15rem;
    box-shadow: 0 20px 50px rgba(14,12,18,0.22);
  }
  .parent-trust-banner__mark img { width: 100%; height: auto; display: block; }
  .parent-trust-banner__eyebrow {
    color: var(--rfa-gold-400);
    font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wider);
    text-transform: uppercase;
    font-weight: 700;
  }
  .parent-trust-banner__title {
    margin-top: .45rem;
    max-width: 18ch;
    font-family: var(--font-display);
    font-size: clamp(2.1rem, 5vw, 4.25rem);
    line-height: 1.02;
    color: #fff;
  }
  .parent-trust-banner__copy {
    margin-top: 1rem;
    max-width: 62ch;
    color: rgba(255,252,247,0.88);
    font-size: clamp(1rem, 1.5vw, 1.2rem);
    line-height: 1.7;
  }
  .parent-trust-banner__link {
    display: inline-flex;
    margin-top: 1.4rem;
    align-items: center;
    gap: .55rem;
    color: var(--rfa-gold-300);
    font-weight: 700;
    letter-spacing: .03em;
  }
  .parent-trust-banner__link:hover,
  .parent-trust-banner__link:focus-visible { color: #fff; }
  @media (min-width: 760px) {
    .parent-trust-banner__inner { grid-template-columns: minmax(150px, .34fr) 1.66fr; gap: clamp(2rem, 5vw, 4rem); }
  }
'''

          new_css = '''  .parent-trust-banner {
    position: relative;
    overflow: hidden;
    background: linear-gradient(112deg, #2f0f58 0%, #431677 58%, #5b268f 100%);
    color: #fff;
    padding: clamp(1.45rem, 3vw, 2.5rem) var(--gutter);
  }
  .parent-trust-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 90% 20%, rgba(198,162,78,0.20), transparent 30%), linear-gradient(90deg, rgba(14,12,18,0.18), transparent 58%);
    pointer-events: none;
  }
  .parent-trust-banner__inner {
    position: relative;
    z-index: 1;
    max-width: var(--container-max);
    margin: 0 auto;
    display: grid;
    gap: 1.25rem;
    align-items: center;
  }
  .parent-trust-banner__mark {
    width: clamp(105px, 12vw, 150px);
    background: rgba(255,255,255,0.98);
    border-radius: 14px;
    padding: .65rem .8rem;
    box-shadow: 0 14px 36px rgba(14,12,18,0.20);
  }
  .parent-trust-banner__mark img { width: 100%; height: auto; display: block; }
  .parent-trust-banner__eyebrow {
    color: var(--rfa-gold-300);
    font-size: .72rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .parent-trust-banner__title {
    margin-top: .3rem;
    max-width: 30ch;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(1.75rem, 3.25vw, 3.1rem);
    font-weight: 500;
    line-height: 1.02;
    letter-spacing: -.015em;
    color: #fff;
  }
  .parent-trust-banner__copy {
    margin-top: .55rem;
    max-width: 82ch;
    color: rgba(255,252,247,0.86);
    font-family: 'Inter', sans-serif;
    font-size: clamp(.95rem, 1.2vw, 1.08rem);
    line-height: 1.55;
  }
  @media (min-width: 760px) {
    .parent-trust-banner__inner { grid-template-columns: minmax(115px, 150px) 1fr; gap: clamp(1.5rem, 3vw, 2.75rem); }
  }
'''

          old_html = '''<section class="parent-trust-banner" aria-labelledby="parent-trust-title">
  <div class="parent-trust-banner__inner">
    <div class="parent-trust-banner__mark" data-reveal="up">
      <img src="https://media.royalfamilyacademy.org/acsi/acsi-logo.png" alt="Association of Christian Schools International accreditation mark">
    </div>
    <div data-reveal="up">
      <p class="parent-trust-banner__eyebrow">A Foundation Parents Can Trust</p>
      <h2 class="parent-trust-banner__title" id="parent-trust-title">Christian education with recognised accreditation.</h2>
      <p class="parent-trust-banner__copy">Royal Family Academy is an ACSI Accredited School. For parents, that means the Christian foundation surrounding your child is not simply part of our language; it is part of a school community that has undergone a recognised accreditation process. From the earliest years, we are intentional about building faith, character and a strong academic foundation together.</p>
      <a class="parent-trust-banner__link" href="https://royalfamilyacademy.org/">Learn more about Royal Family Academy <span aria-hidden="true">→</span></a>
    </div>
  </div>
</section>'''

          new_html = '''<section class="parent-trust-banner" aria-labelledby="parent-trust-title">
  <div class="parent-trust-banner__inner">
    <div class="parent-trust-banner__mark" data-reveal="up">
      <img src="https://media.royalfamilyacademy.org/acsi/acsi-accredited-logo.jpg" alt="ACSI Accredited School logo">
    </div>
    <div data-reveal="up">
      <p class="parent-trust-banner__eyebrow">ACSI Accredited School</p>
      <h2 class="parent-trust-banner__title" id="parent-trust-title">Christian education, held to a recognised standard.</h2>
      <p class="parent-trust-banner__copy">Royal Family Academy combines intentional Christian formation with academic excellence, giving parents confidence in the foundation shaping their child.</p>
    </div>
  </div>
</section>'''

          if old_css not in s:
              raise SystemExit('Expected old ACSI banner CSS was not found')
          if old_html not in s:
              raise SystemExit('Expected old ACSI banner markup was not found')

          s = s.replace(old_css, new_css, 1).replace(old_html, new_html, 1)
          p.write_text(s)
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nurseryandprimaryschool/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine compact ACSI accreditation banner"
          git push
