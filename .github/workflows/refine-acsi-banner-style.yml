name: Refine ACSI banner style

on:
  push:
    paths:
      - '.github/workflows/refine-acsi-banner-style.yml'

permissions:
  contents: write

jobs:
  refine-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ACSI banner styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nurseryandprimaryschool/index.html')
          s = p.read_text()

          s = s.replace("""  .parent-trust-banner__mark {
    width: clamp(105px, 12vw, 150px);
    background: rgba(255,255,255,0.98);
    border-radius: 14px;
    padding: .65rem .8rem;
    box-shadow: 0 14px 36px rgba(14,12,18,0.20);
  }
  .parent-trust-banner__mark img { width: 100%; height: auto; display: block; }
""", """  .parent-trust-banner__mark {
    width: clamp(105px, 12vw, 150px);
    background: transparent;
    padding: 0;
    box-shadow: none;
  }
  .parent-trust-banner__mark img { width: 100%; height: auto; display: block; background: transparent; }
""", 1)

          s = s.replace("""  .parent-trust-banner__eyebrow {
    color: var(--rfa-gold-300);
""", """  .parent-trust-banner__eyebrow {
    color: #6fc2ff;
""", 1)

          s = s.replace("""    letter-spacing: -.015em;
    color: #fff;
  }
""", """    letter-spacing: .015em;
    text-transform: uppercase;
    color: #fff;
  }
""", 1)

          s = s.replace("""    line-height: 1.55;
  }
""", """    line-height: 1.55;
    text-align: justify;
    text-justify: inter-word;
  }
""", 1)

          p.write_text(s)
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nurseryandprimaryschool/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine ACSI accreditation banner styling"
          git push
