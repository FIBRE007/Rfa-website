name: Install RFA crest favicon

on:
  push:
    branches: [main]
    paths:
      - 'scripts/install-rfa-favicon.mjs'
      - '.github/workflows/install-rfa-favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install crest favicon across RFA sites
        run: node scripts/install-rfa-favicon.mjs

      - name: Remove one-time installer
        run: |
          rm -f scripts/install-rfa-favicon.mjs
          rm -f .github/workflows/install-rfa-favicon.yml

      - name: Commit favicon references
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Favicon references are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+FIBRE007@users.noreply.github.com"
          git add -A
          git commit -m "Use RFA crest favicon across website"
          git pull --rebase origin main
          git push origin main
